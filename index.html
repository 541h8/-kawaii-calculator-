<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✨ 萌萌科学计算器 ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: url('http://yb.woa.com/By1oxiq1qiR') center/cover no-repeat fixed;
    background-color: #2a1b4d;
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
    touch-action: manipulation;
    padding: 20px 10px;
  }
  /* 视口够高时垂直居中，避免小计算器在桌面端贴顶 */
  @media (min-height: 720px) {
    body { align-items: center; }
  }

  /* 暗色模式背景图 */
  body.theme-dark {
    background: url('http://yb.woa.com/EBYaU8FHhXL') center/cover no-repeat fixed;
    background-color: #0f0c29;
  }

  /* 漂浮的小装饰 */
  .deco {
    position: fixed;
    font-size: 28px;
    opacity: .35;
    animation: deco-float 5s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  .deco:nth-child(1) { top: 6%;  left: 8%;  animation-delay: 0s;   font-size: 32px; }
  .deco:nth-child(2) { top: 12%; right: 6%; animation-delay: 1.2s; font-size: 24px; }
  .deco:nth-child(3) { bottom: 10%; left: 10%; animation-delay: 2.4s; font-size: 30px; }
  .deco:nth-child(4) { bottom: 6%; right: 12%; animation-delay: 1.8s; font-size: 26px; }
  .deco:nth-child(5) { top: 45%; left: 3%; animation-delay: 3s; font-size: 22px; }
  .deco:nth-child(6) { top: 35%; right: 4%; animation-delay: 2.1s; font-size: 28px; }
  .deco:nth-child(7) { top: 75%; left: 5%; animation-delay: 0.8s; font-size: 24px; }
  .deco:nth-child(8) { top: 80%; right: 6%; animation-delay: 3.5s; font-size: 30px; }

  @keyframes deco-float {
    0%, 100% { transform: translateY(-12px) rotate(-6deg); }
    33%      { transform: translateY(0) rotate(0deg); }
    66%      { transform: translateY(12px) rotate(6deg); }
  }

  .calc {
    position: relative;
    z-index: 1;
    width: 320px;
    max-height: calc(100vh - 40px);
    margin: 10px 0;
    display: flex;
    flex-direction: column;
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 32px;
    padding: 26px 22px 24px;
    box-shadow:
      0 20px 50px rgba(240, 140, 180, .25),
      inset 0 1px 0 rgba(255,255,255,.9);
    border: 2px solid rgba(255,255,255,.6);
  }

  /* 小表情 */
  .mascot-wrap {
    position: relative;
    text-align: center;
    margin-bottom: 4px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mascot {
    font-size: 42px;
    display: inline-block;
    animation: float-bob 2.4s ease-in-out infinite, blink 4s ease infinite;
    transition: transform .15s;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
  }
  .mascot.big-pop { animation: float-bob 2.4s ease-in-out infinite, blink 4s ease infinite, popBig .4s ease; }
  .mascot.shake { animation: shake .4s ease; }
  .mascot.spin { animation: spin .6s ease; }
  .mascot.heart::after {
    content: '💕';
    position: absolute;
    top: -8px; right: calc(50% - 12px);
    font-size: 20px;
    animation: floatUp 1.2s ease forwards;
  }
  .mascot.sparkle::before {
    content: '✨';
    position: absolute;
    top: -4px; left: calc(50% - 10px);
    font-size: 18px;
    animation: floatUp 1s ease forwards;
  }
  .mascot.think::after {
    content: '❓';
    position: absolute;
    top: -10px; right: calc(50% - 14px);
    font-size: 18px;
    animation: floatUp 1s ease forwards;
  }
  @keyframes float-bob {
    0%   { transform: translateY(-8px); }
    25%  { transform: translateY(0px); }
    50%  { transform: translateY(8px); }
    75%  { transform: translateY(0px); }
    100% { transform: translateY(-8px); }
  }
  @keyframes blink {
    0%, 45%, 55%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.1); }
  }
  @keyframes popBig {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    20%  { transform: translateX(-6px) rotate(-8deg); }
    40%  { transform: translateX(6px) rotate(8deg); }
    60%  { transform: translateX(-4px) rotate(-5deg); }
    80%  { transform: translateX(4px) rotate(5deg); }
  }
  @keyframes spin {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(180deg) scale(1.2); }
    100% { transform: rotate(360deg) scale(1); }
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(.5); }
    100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
  }

  .display {
    flex-shrink: 0;
    background: linear-gradient(180deg, #fff5fa, #fce4ec);
    border-radius: 20px;
    padding: 16px 18px 14px;
    margin-bottom: 16px;
    text-align: right;
    box-shadow: inset 0 3px 10px rgba(200,120,160,.15);
    border: 2px solid rgba(244,143,177,.25);
    min-height: 88px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .display .expr {
    font-size: 15px;
    color: #c98fb0;
    min-height: 20px;
    word-break: break-all;
    overflow: hidden;
  }

  .display .result {
    font-size: 40px;
    font-weight: 700;
    color: #d81b60;
    line-height: 1.1;
    word-break: break-all;
    overflow: hidden;
    transition: transform .08s;
  }
  .display .result.pop { transform: scale(1.06); }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    min-height: 0;
  }

  button {
    border: none;
    outline: none;
    height: 56px;
    border-radius: 18px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    color: #7b4a7a;
    background: linear-gradient(145deg, #ffffff, #fce4ec);
    box-shadow:
      0 4px 0 #f48fb1,
      0 6px 12px rgba(244,143,177,.25);
    transition: transform .06s, box-shadow .06s;
    user-select: none;
    -webkit-user-select: none;
    font-family: inherit;
    touch-action: manipulation;
  }
  button:active {
    transform: translateY(4px);
    box-shadow:
      0 0 0 #f48fb1,
      0 2px 4px rgba(244,143,177,.25);
  }

  button.op {
    background: linear-gradient(145deg, #fce4ec, #f8bbd0);
    color: #c2185b;
  }
  button.fn {
    background: linear-gradient(145deg, #ede7f6, #d1c4e9);
    color: #6a1b9a;
    font-size: 18px;
  }
  button.eq {
    background: linear-gradient(145deg, #ff8a80, #ff5252);
    color: #fff;
    font-size: 26px;
    box-shadow:
      0 4px 0 #d32f2f,
      0 6px 12px rgba(255,82,82,.35);
  }
  button.eq:active {
    box-shadow:
      0 0 0 #d32f2f,
      0 2px 4px rgba(255,82,82,.35);
  }
  button.zero { grid-column: span 2; }

  /* 模式切换按钮 */
  .mode-toggle {
    flex-shrink: 0;
    text-align: center;
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
  }
  .mode-toggle button {
    height: 32px;
    font-size: 14px;
    border-radius: 16px;
    padding: 0 16px;
    background: linear-gradient(145deg, #ede7f6, #d1c4e9);
    color: #6a1b9a;
    box-shadow: 0 2px 0 #b39ddb, 0 3px 6px rgba(106,27,154,.2);
  }
  .mode-toggle button:active {
    box-shadow: 0 0 0 #b39ddb, 0 1px 2px rgba(106,27,154,.2);
  }
  .mode-toggle button.active {
    background: linear-gradient(145deg, #ce93d8, #ab47bc);
    color: #fff;
  }

  /* 科学模式：5列布局 */
  .calc.scientific .buttons {
    grid-template-columns: repeat(5, 1fr);
  }
  .calc.scientific { width: 380px; }

  .btn-sci { display: none; }
  .calc.scientific .btn-sci { display: block; }

  /* 单位换算面板 */
  .unit-panel {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    max-width: calc(100vw - 20px);
    max-height: calc(100vh - 40px);
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 32px;
    padding: 20px;
    flex-direction: column;
    z-index: 100;
    animation: slideIn .25s ease;
    box-shadow: 0 20px 50px rgba(240, 140, 180, .3);
  }
  .calc.show-unit .unit-panel { display: flex; }
  .unit-panel h3 {
    font-size: 18px;
    color: #d81b60;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .unit-panel h3 button.close-btn {
    background: linear-gradient(145deg, #e8eaf6, #c5cae9);
    color: #3949ab;
    box-shadow: 0 2px 0 #9fa8da, 0 2px 4px rgba(92,107,192,.2);
    font-size: 16px;
    padding: 0 8px;
    line-height: 1;
    height: 28px;
    border-radius: 14px;
  }
  .unit-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .unit-tabs button {
    height: 28px;
    font-size: 13px;
    padding: 0 12px;
    border-radius: 14px;
    background: linear-gradient(145deg, #e8eaf6, #c5cae9);
    color: #5c6bc0;
    box-shadow: 0 2px 0 #9fa8da;
  }
  .unit-tabs button.active {
    background: linear-gradient(145deg, #ce93d8, #ab47bc);
    color: #fff;
    box-shadow: 0 2px 0 #7b1fa2;
  }
  .unit-body {
    flex: 1;
    overflow-y: auto;
    font-size: 14px;
  }
  .unit-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .unit-row label {
    flex: 0 0 60px;
    color: #7b4a7a;
    font-size: 13px;
  }
  .unit-row input {
    flex: 1;
    height: 36px;
    border: 2px solid rgba(244,143,177,.3);
    border-radius: 12px;
    padding: 0 10px;
    font-size: 15px;
    font-family: inherit;
    background: #fff;
    color: #5d4037;
    outline: none;
  }
  .unit-row input:focus { border-color: #f48fb1; }

  /* 日期计算面板 */
  .date-panel {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    max-width: calc(100vw - 20px);
    max-height: calc(100vh - 40px);
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 32px;
    padding: 20px;
    flex-direction: column;
    z-index: 100;
    animation: slideIn .25s ease;
    box-shadow: 0 20px 50px rgba(240, 140, 180, .3);
  }
  .calc.show-date .date-panel { display: flex; }
  .date-panel h3 {
    font-size: 18px;
    color: #d81b60;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .date-panel h3 button.close-btn {
    background: linear-gradient(145deg, #e8eaf6, #c5cae9);
    color: #3949ab;
    box-shadow: 0 2px 0 #9fa8da, 0 2px 4px rgba(92,107,192,.2);
    font-size: 16px;
    padding: 0 8px;
    line-height: 1;
    height: 28px;
    border-radius: 14px;
  }
  .date-body {
    flex: 1;
    overflow-y: auto;
    font-size: 14px;
    color: #7b4a7a;
  }
  .date-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .date-row label {
    flex: 0 0 80px;
    color: #7b4a7a;
    font-size: 13px;
  }
  .date-row input {
    flex: 1;
    height: 36px;
    border: 2px solid rgba(244,143,177,.3);
    border-radius: 12px;
    padding: 0 10px;
    font-size: 15px;
    font-family: inherit;
    background: #fff;
    color: #5d4037;
    outline: none;
  }
  .date-row input:focus { border-color: #f48fb1; }
  .date-result {
    margin-top: 12px;
    padding: 14px;
    background: linear-gradient(145deg, #fff5fa, #fce4ec);
    border-radius: 14px;
    font-size: 15px;
    color: #d81b60;
    font-weight: 600;
    text-align: center;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px;
  }

  /* 历史记录 */
  .history-panel {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    max-width: calc(100vw - 20px);
    max-height: calc(100vh - 40px);
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 32px;
    padding: 20px;
    flex-direction: column;
    z-index: 100;
    animation: slideIn .25s ease;
    box-shadow: 0 20px 50px rgba(240, 140, 180, .3);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translate(-50%, -50%) translateY(-12px) scale(.97); }
    to   { opacity: 1; transform: translate(-50%, -50%) translateY(0) scale(1); }
  }
  .calc.show-history .history-panel { display: flex; }
  .history-panel h3 {
    font-size: 18px;
    color: #d81b60;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .history-panel h3 .h-actions {
    display: flex;
    gap: 6px;
  }
  .history-panel h3 button {
    height: 28px; font-size: 12px; padding: 0 10px; border-radius: 14px;
    background: linear-gradient(145deg, #ffcdd2, #ef9a9a);
    color: #c62828; box-shadow: 0 2px 0 #ef5350, 0 2px 4px rgba(239,83,80,.2);
  }
  .history-panel h3 button.close-btn {
    background: linear-gradient(145deg, #e8eaf6, #c5cae9);
    color: #3949ab;
    box-shadow: 0 2px 0 #9fa8da, 0 2px 4px rgba(92,107,192,.2);
    font-size: 16px;
    padding: 0 8px;
    line-height: 1;
  }
  .history-list {
    flex: 1;
    overflow-y: auto;
    font-size: 14px;
    color: #7b4a7a;
    -webkit-overflow-scrolling: touch;
  }
  .history-item {
    padding: 8px 10px;
    border-bottom: 1px solid rgba(244,143,177,.15);
    cursor: pointer;
    border-radius: 8px;
    transition: background .15s;
  }
  .history-item:hover { background: rgba(244,143,177,.08); }
  .history-item .he { color: #c98fb0; font-size: 12px; }
  .history-item .hr { color: #d81b60; font-weight: 700; font-size: 16px; text-align: right; }

  /* 主题切换 */
  body.theme-dark {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  }
  body.theme-dark .calc {
    background: rgba(30,30,50,.85);
    border-color: rgba(100,100,150,.3);
  }
  body.theme-dark .display {
    background: linear-gradient(180deg, #1e1e3a, #16213e);
    border-color: rgba(100,100,200,.25);
    box-shadow: inset 0 3px 10px rgba(0,0,0,.3);
  }
  body.theme-dark .display .result { color: #ff80ab; }
  body.theme-dark .display .expr { color: #b39ddb; }
  body.theme-dark button {
    background: linear-gradient(145deg, #2a2a4a, #1e1e3a);
    color: #e0e0ff;
    box-shadow: 0 4px 0 #4a4a6a, 0 6px 12px rgba(0,0,0,.3);
  }
  body.theme-dark button:active {
    box-shadow: 0 0 0 #4a4a6a, 0 2px 4px rgba(0,0,0,.3);
  }
  body.theme-dark button.op { background: linear-gradient(145deg, #3a2a4a, #2a1a3a); color: #ff80ab; }
  body.theme-dark button.fn { background: linear-gradient(145deg, #2a2a5a, #1a1a3a); color: #b39ddb; }
  body.theme-dark button.eq { background: linear-gradient(145deg, #c62828, #8e0000); color: #fff; }
  body.theme-dark .mascot { filter: drop-shadow(0 0 6px rgba(255,128,171,.3)); }
  body.theme-dark .history-panel,
  body.theme-dark .unit-panel,
  body.theme-dark .date-panel {
    background: rgba(30,30,50,.97);
  }
  body.theme-dark .history-item { border-bottom-color: rgba(100,100,200,.15); }
  body.theme-dark .history-item:hover { background: rgba(100,100,200,.08); }
  body.theme-dark .history-item .he { color: #b39ddb; }
  body.theme-dark .history-item .hr { color: #ff80ab; }
  body.theme-dark .history-panel h3 { color: #ff80ab; }
  body.theme-dark .unit-panel h3 { color: #ff80ab; }
  body.theme-dark .date-panel h3 { color: #ff80ab; }
  body.theme-dark .unit-row input,
  body.theme-dark .date-row input {
    background: #1e1e3a;
    color: #e0e0ff;
    border-color: rgba(100,100,200,.3);
  }
  body.theme-dark .unit-tabs button {
    background: linear-gradient(145deg, #2a2a5a, #1a1a3a);
    color: #b39ddb;
  }
  body.theme-dark .unit-tabs button.active {
    background: linear-gradient(145deg, #7b1fa2, #4a148c);
    color: #fff;
  }
  body.theme-dark .date-result {
    background: linear-gradient(145deg, #1e1e3a, #16213e);
    color: #ff80ab;
  }

  /* 打字指示器：计算时小表情的动画 */
  .typing-dots::after {
    content: '···';
    animation: typing 1s steps(4, end) infinite;
    letter-spacing: 2px;
  }
  @keyframes typing {
    0%, 100% { opacity: .3; }
    50% { opacity: 1; }
  }

  /* 复制成功提示 */
  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,.75);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    transition: all .3s;
    z-index: 200;
    pointer-events: none;
    max-width: 80vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 彩带 */
  .confetti {
    position: fixed;
    top: -10px;
    width: 10px; height: 14px;
    z-index: 99;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* 计算器网格分组标题 */
  .grid-section-title {
    grid-column: 1 / -1;
    font-size: 11px;
    color: #d7b0c9;
    text-align: center;
    margin-top: 2px;
    margin-bottom: -4px;
    letter-spacing: 2px;
  }


  /* 音效面板 */
  .sound-panel { width: 360px; }
  .sound-panel .panel-body { padding-top: 8px; }
  .sound-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 9px;
  }
  .sound-row label { flex: 0 0 60px; font-size: 12px; color: #6a1b9a; font-weight: 700; }
  body.theme-dark .sound-row label { color: #f48fb1; }
  .sound-row input[type=range] {
    flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
    background: linear-gradient(90deg,#ab47bc,#f48fb1); border-radius: 4px; outline: none;
  }
  .sound-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 3px solid #ab47bc; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .sound-row input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 3px solid #ab47bc; cursor: pointer;
  }
  .vol-val { flex: 0 0 40px; font-size: 11px; color: #888; text-align: right; }
  .sound-section-title {
    font-size: 12px; font-weight: 800; color: #ab47bc;
    margin: 12px 0 7px; padding-left: 6px; border-left: 3px solid #f48fb1;
  }
  body.theme-dark .sound-section-title { color: #f48fb1; }
  .preset-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 4px;
  }
  .preset-card {
    display: flex; align-items: center; gap: 6px;
    background: linear-gradient(145deg,#fce4ec,#f3e5f5);
    border: 2px solid #e1bee7; border-radius: 10px;
    padding: 6px 8px; cursor: pointer; transition: all .15s;
    user-select: none;
  }
  body.theme-dark .preset-card { background: linear-gradient(145deg,#2a1a3a,#1a1a2e); border-color: #4a148c; }
  .preset-card:hover { transform: translateY(-1px); border-color: #f48fb1; }
  .preset-card.active { border-color: #e91e63; background: linear-gradient(145deg,#f8bbd0,#e1bee7); box-shadow: 0 2px 8px rgba(233,30,99,.3); }
  body.theme-dark .preset-card.active { background: linear-gradient(145deg,#3a1a4a,#2a1a3a); }
  .preset-card .p-emoji { font-size: 16px; line-height: 1; }
  .preset-card .p-name { font-size: 11px; color: #6a1b9a; font-weight: 700; flex: 1; }
  body.theme-dark .preset-card .p-name { color: #f48fb1; }
  .preset-card .p-play {
    font-size: 10px; padding: 2px 6px; border-radius: 6px;
    background: #ab47bc; color: #fff; border: none; cursor: pointer; flex: 0 0 auto;
  }
  .preset-card .p-play:active { transform: scale(.9); }
  .sound-tip { font-size: 10px; color: #999; text-align: center; margin-top: 10px; line-height: 1.6; }
  /* 音效开关 */
  .mode-toggle button.sound-on { background: linear-gradient(145deg, #c8e6c9, #a5d6a7); color: #2e7d32; }
  .mode-toggle button.sound-off { background: linear-gradient(145deg, #ffcdd2, #ef9a9a); color: #c62828; }

  /* 跑马灯彩蛋 */
  .marquee-egg {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 24px;
    overflow: hidden;
    z-index: 5;
    pointer-events: none;
    opacity: 0.6;
  }
  .marquee-egg span {
    display: inline-block;
    white-space: nowrap;
    animation: marquee 20s linear infinite;
    font-size: 14px;
    color: #f48fb1;
  }
  @keyframes marquee {
    from { transform: translateX(100vw); }
    to   { transform: translateX(-100%); }
  }

  /* ============ 通用面板样式 ============ */
  .panel-base {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 340px;
    max-width: calc(100vw - 20px);
    max-height: calc(100vh - 40px);
    background: rgba(255,255,255,.97);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 28px;
    padding: 18px 18px 16px;
    flex-direction: column;
    z-index: 100;
    animation: panelPop .25s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 24px 60px rgba(120, 80, 200, .35);
    border: 2px solid rgba(255,255,255,.7);
  }
  @keyframes panelPop {
    from { opacity: 0; transform: translate(-50%, -50%) scale(.9) translateY(10px); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1) translateY(0); }
  }
  .calc.show-prog .prog-panel,
  .calc.show-stats .stats-panel,
  .calc.show-eq .eq-panel,
  .calc.show-geo .geo-panel,
  .calc.show-fin .fin-panel,
  .calc.show-graph .graph-panel { display: flex; }
  .calc.show-sound .sound-panel { display: flex; }
  .sound-panel .close-btn { margin-left: auto; }
  .panel-base h3 {
    font-size: 17px;
    color: #6a1b9a;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .panel-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    min-height: 0;
    font-size: 13px;
    color: #5d4037;
  }
  .panel-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .panel-row label {
    flex: 0 0 72px;
    color: #7b4a7a;
    font-size: 12px;
    font-weight: bold;
  }
  .panel-row input,
  .panel-body textarea,
  .panel-body select {
    flex: 1;
    border: 2px solid rgba(186,104,200,.3);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: #4a148c;
    outline: none;
    box-sizing: border-box;
  }
  .panel-row input.mono { font-family: 'Courier New', monospace; letter-spacing: 1px; }
  .panel-body textarea {
    width: 100%;
    resize: vertical;
    min-height: 56px;
    margin-bottom: 10px;
  }
  .panel-row input:focus,
  .panel-body textarea:focus,
  .panel-body select:focus { border-color: #ba68c8; box-shadow: 0 0 0 3px rgba(186,104,200,.15); }
  .panel-sub {
    font-size: 12px;
    color: #8e6a9e;
    margin: 6px 0 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .panel-sub button {
    height: 26px;
    font-size: 11px;
    padding: 0 8px;
    border-radius: 8px;
    background: linear-gradient(145deg, #e1bee7, #ce93d8);
    color: #4a148c;
    box-shadow: 0 2px 0 #ab47bc;
  }
  .panel-sub button:active { transform: translateY(2px); box-shadow: 0 0 0 #ab47bc; }
  .panel-sub select {
    flex: 0 1 auto;
    width: auto;
    height: 26px;
    padding: 0 6px;
  }
  .panel-sub .chk { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .panel-sub .chk input { width: auto; flex: none; }
  .panel-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .panel-tabs button {
    height: 28px;
    font-size: 12px;
    padding: 0 10px;
    border-radius: 14px;
    background: linear-gradient(145deg, #f3e5f5, #e1bee7);
    color: #7b1fa2;
    box-shadow: 0 2px 0 #ce93d8;
  }
  .panel-tabs button.active {
    background: linear-gradient(145deg, #ba68c8, #8e24aa);
    color: #fff;
    box-shadow: 0 2px 0 #6a1b9a;
  }
  .panel-btn {
    width: 100%;
    height: 40px;
    font-size: 15px;
    border-radius: 14px;
    margin: 4px 0 10px;
    background: linear-gradient(145deg, #ce93d8, #ab47bc) !important;
    color: #fff !important;
    box-shadow: 0 4px 0 #7b1fa2 !important;
    font-weight: bold;
  }
  .panel-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7b1fa2 !important; }
  .panel-result {
    background: linear-gradient(145deg, #f3e5f5, #ede7f6);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 13px;
    color: #4a148c;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 20px;
  }
  .panel-result .num { font-weight: bold; color: #d81b60; }
  .panel-result .lbl { color: #7b4a7a; }
  .eq-body .panel-row,
  .geo-body .panel-row,
  .fin-body .panel-row { margin-bottom: 8px; }
  .geo-body select { flex: 1; }
  .hint { font-size: 12px; color: #9e7aa8; margin: 0 0 4px; }
  .panel-body::-webkit-scrollbar { width: 6px; }
  .panel-body::-webkit-scrollbar-thumb { background: rgba(186,104,200,.4); border-radius: 3px; }

  /* 第二行科学按钮：默认隐藏，科学模式才显示 */
  .btn-sci2 { display: none; }
  .calc.scientific .btn-sci2 { display: block; }

  /* 功能入口超过一屏时滚动 */
  .mode-toggle { max-height: 96px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ============ 函数图像面板样式 ============ */
  .graph-panel { width: 380px; }
  .graph-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 10px;
  }
  .graph-presets button {
    height: 26px;
    font-size: 11px;
    padding: 0 9px;
    border-radius: 8px;
    background: linear-gradient(145deg, #e1bee7, #ce93d8);
    color: #4a148c;
    box-shadow: 0 2px 0 #ab47bc;
    flex: 0 0 auto;
  }
  .graph-presets button:active { transform: translateY(2px); box-shadow: 0 0 0 #ab47bc; }
  .graph-presets button.active {
    background: linear-gradient(145deg, #ba68c8, #8e24aa);
    color: #fff;
    box-shadow: 0 2px 0 #6a1b9a;
  }
  .graph-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .graph-input-row label {
    color: #7b4a7a;
    font-size: 14px;
    font-weight: bold;
  }
  .graph-input-row input {
    flex: 1;
    border: 2px solid rgba(186,104,200,.4);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 14px;
    font-family: 'Courier New', monospace;
    outline: none;
    background: #fff;
    color: #4a148c;
    box-sizing: border-box;
  }
  .graph-input-row input:focus { border-color: #ba68c8; box-shadow: 0 0 0 3px rgba(186,104,200,.15); }
  .panel-btn-inline {
    height: 32px;
    font-size: 13px;
    padding: 0 14px;
    border-radius: 10px;
    background: linear-gradient(145deg, #ce93d8, #ab47bc) !important;
    color: #fff !important;
    box-shadow: 0 3px 0 #7b1fa2 !important;
    flex: 0 0 auto;
    font-weight: bold;
  }
  .panel-btn-inline:active { transform: translateY(2px); box-shadow: 0 1px 0 #7b1fa2 !important; }
  .graph-range {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #8e6a9e;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .graph-range input {
    width: 62px;
    border: 2px solid rgba(186,104,200,.3);
    border-radius: 8px;
    padding: 4px 6px;
    font-size: 12px;
    text-align: center;
    background: #fff;
    color: #4a148c;
    outline: none;
    box-sizing: border-box;
  }
  .graph-range input:focus { border-color: #ba68c8; }
  .graph-range .chk { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; }
  .canvas-wrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid rgba(186,104,200,.3);
    background: #fafafa;
    touch-action: none;
  }
  .canvas-wrap canvas {
    display: block;
    width: 100%;
    height: auto;
    cursor: crosshair;
  }
  .canvas-hint {
    position: absolute;
    bottom: 4px; right: 8px;
    font-size: 10px;
    color: #999;
    pointer-events: none;
    background: rgba(255,255,255,.7);
    padding: 1px 6px;
    border-radius: 6px;
  }
  .graph-info {
    margin-top: 8px;
    background: linear-gradient(145deg, #f3e5f5, #ede7f6);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    color: #4a148c;
    line-height: 1.6;
    min-height: 18px;
    white-space: pre-wrap;
  }
  .graph-info .num { font-weight: bold; color: #d81b60; }
  .graph-info .lbl { color: #7b4a7a; }

  body.theme-dark .graph-presets button {
    background: linear-gradient(145deg, #4a2a6a, #3a1a5a);
    color: #ce93d8;
    box-shadow: 0 2px 0 #7b1fa2;
  }
  body.theme-dark .graph-presets button.active {
    background: linear-gradient(145deg, #7b1fa2, #4a148c);
    color: #fff;
  }
  body.theme-dark .graph-input-row input,
  body.theme-dark .graph-range input {
    background: #1e1e3a;
    color: #e1bee7;
    border-color: rgba(150,120,220,.35);
  }
  body.theme-dark .canvas-wrap {
    background: #0f0f1e;
    border-color: rgba(150,120,220,.3);
  }
  body.theme-dark .graph-info {
    background: linear-gradient(145deg, #1e1e3a, #16213e);
    color: #ce93d8;
  }
  body.theme-dark .graph-info .num { color: #ff80ab; }
  body.theme-dark .canvas-hint { background: rgba(30,30,50,.7); color: #b39ddb; }

  body.theme-dark .panel-base {
    background: rgba(30,28,55,.97);
    border-color: rgba(120,100,200,.3);
  }
  body.theme-dark .panel-base h3 { color: #ce93d8; }
  body.theme-dark .panel-row input,
  body.theme-dark .panel-body textarea,
  body.theme-dark .panel-body select {
    background: #1e1e3a;
    color: #e1bee7;
    border-color: rgba(150,120,220,.35);
  }
  body.theme-dark .panel-sub { color: #b39ddb; }
  body.theme-dark .panel-sub button {
    background: linear-gradient(145deg, #4a2a6a, #3a1a5a);
    color: #ce93d8;
    box-shadow: 0 2px 0 #7b1fa2;
  }
  body.theme-dark .panel-tabs button {
    background: linear-gradient(145deg, #2a2a5a, #1a1a3a);
    color: #b39ddb;
    box-shadow: 0 2px 0 #6a1b9a;
  }
  body.theme-dark .panel-tabs button.active {
    background: linear-gradient(145deg, #7b1fa2, #4a148c);
    color: #fff;
  }
  body.theme-dark .panel-result {
    background: linear-gradient(145deg, #1e1e3a, #16213e);
    color: #ce93d8;
  }
  body.theme-dark .panel-result .num { color: #ff80ab; }
  body.theme-dark .hint { color: #b39ddb; }
</style>
</head>
<body>

<div class="deco">⭐</div>
<div class="deco">💖</div>
<div class="deco">🍬</div>
<div class="deco">🌸</div>
<div class="deco">✨</div>
<div class="deco">🦄</div>
<div class="deco">🌙</div>
<div class="deco">☁️</div>

<div class="marquee-egg"><span>🧮 萌萌计算器 · 算算更健康 · ✨ 42 是终极答案 · 520 我 ❤️ 你 · π 是 🥧 · (っ'ω')っ 💕</span></div>

<div class="calc" id="calc">
  <div class="mascot-wrap">
    <span class="mascot" id="mascot" title="点我摸摸～">(´｡• ᵕ •｡`)</span>
  </div>

  <div class="mode-toggle">
    <button id="toggleSci">🔬 科学</button>
    <button id="toggleTheme">🌙 暗色</button>
    <button id="toggleBg">🖼️ 换图</button>
    <button id="toggleUnit">📐 换算</button>
    <button id="toggleDate">📅 日期</button>
    <button id="toggleSound" class="sound-on">🔔 音效</button>
    <button id="toggleVoice">🎀 萝莉音</button>
    <button id="toggleHistory">📋 历史</button>
    <button id="toggleProgrammer">💻 进制</button>
    <button id="toggleStats">📊 统计</button>
    <button id="toggleEquation">🧩 方程</button>
    <button id="toggleGeometry">📐 几何</button>
    <button id="toggleFinance">💰 金融</button>
    <button id="toggleGraph">📈 绘图</button>
  </div>

  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="buttons">
    <!-- 进阶函数行（科学模式） -->
    <button class="fn btn-sci btn-sci2" data-k="sinh">sinh</button>
    <button class="fn btn-sci btn-sci2" data-k="cosh">cosh</button>
    <button class="fn btn-sci btn-sci2" data-k="tanh">tanh</button>
    <button class="fn btn-sci btn-sci2" data-k="mod">mod</button>
    <button class="fn btn-sci btn-sci2" data-k="cbrt">∛</button>

    <!-- 统计函数行（科学模式） -->
    <button class="fn btn-sci" data-k="rand">Rand</button>
    <button class="fn btn-sci" data-k="round">Round</button>
    <button class="fn btn-sci" data-k="ceil">Ceil</button>
    <button class="fn btn-sci" data-k="floor">Floor</button>
    <button class="fn btn-sci" data-k="nPr">nPr</button>

    <!-- 科学函数行 -->
    <button class="fn btn-sci" data-k="sin">sin</button>
    <button class="fn btn-sci" data-k="cos">cos</button>
    <button class="fn btn-sci" data-k="tan">tan</button>
    <button class="fn btn-sci" data-k="sqrt">√</button>
    <button class="fn btn-sci" data-k="sq">x²</button>

    <button class="fn btn-sci" data-k="asin">sin⁻¹</button>
    <button class="fn btn-sci" data-k="acos">cos⁻¹</button>
    <button class="fn btn-sci" data-k="atan">tan⁻¹</button>
    <button class="fn btn-sci" data-k="pow">xʸ</button>
    <button class="fn btn-sci" data-k="fact">x!</button>

    <button class="fn btn-sci" data-k="log">log</button>
    <button class="fn btn-sci" data-k="ln">ln</button>
    <button class="fn btn-sci" data-k="inv">1/x</button>
    <button class="fn btn-sci" data-k="abs">|x|</button>
    <button class="fn btn-sci" data-k="nCr">nCr</button>

    <button class="fn btn-sci" data-k="pi">π</button>
    <button class="fn btn-sci" data-k="e">e</button>
    <button class="fn btn-sci" data-k="exp">eˣ</button>
    <button class="fn btn-sci" data-k="tenPow">10ˣ</button>
    <button class="fn btn-sci" data-k="twoPow">2ˣ</button>

    <!-- 实用工具行 -->
    <button class="fn btn-sci" data-k="±">±</button>
    <button class="fn btn-sci" data-k="deg" id="degBtn">DEG</button>
    <button class="fn btn-sci" data-k="M+">M+</button>
    <button class="fn btn-sci" data-k="MR">MR</button>
    <button class="fn btn-sci" data-k="MC">MC</button>

    <!-- 基础行 -->
    <button class="fn" data-k="C">C</button>
    <button class="fn" data-k="back">⌫</button>
    <button class="fn" data-k="%">%</button>
    <button class="op" data-k="/">÷</button>

    <button data-k="7">7</button>
    <button data-k="8">8</button>
    <button data-k="9">9</button>
    <button class="op" data-k="*">×</button>

    <button data-k="4">4</button>
    <button data-k="5">5</button>
    <button data-k="6">6</button>
    <button class="op" data-k="-">−</button>

    <button data-k="1">1</button>
    <button data-k="2">2</button>
    <button data-k="3">3</button>
    <button class="op" data-k="+">+</button>

    <button class="zero" data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=">=</button>
  </div>

  <!-- 单位换算面板 -->
  <div class="unit-panel" id="unitPanel">
    <h3>
      <span>📐 单位换算</span>
      <button class="close-btn" id="closeUnit" title="关闭">✕</button>
    </h3>
    <div class="unit-tabs" id="unitTabs">
      <button class="active" data-cat="length">📏 长度</button>
      <button data-cat="weight">⚖️ 重量</button>
      <button data-cat="temp">🌡️ 温度</button>
      <button data-cat="area">📐 面积</button>
      <button data-cat="speed">🚀 速度</button>
    </div>
    <div class="unit-body" id="unitBody"></div>
  </div>

  <!-- 日期计算面板 -->
  <div class="date-panel" id="datePanel">
    <h3>
      <span>📅 日期计算</span>
      <button class="close-btn" id="closeDate" title="关闭">✕</button>
    </h3>
    <div class="date-body">
      <div class="date-row">
        <label>起始日期</label>
        <input type="date" id="dateStart">
      </div>
      <div class="date-row">
        <label>结束日期</label>
        <input type="date" id="dateEnd">
      </div>
      <div class="date-row">
        <label>加/减天数</label>
        <input type="number" id="dateOffset" placeholder="输入天数，可为负数">
      </div>
      <button id="calcDate" style="width:100%;margin-top:8px;height:40px;font-size:16px;">🧮 计算</button>
      <div class="date-result" id="dateResult">选择日期后点击计算～</div>
    </div>
  </div>

  <!-- 历史记录面板 -->
  <div class="history-panel" id="historyPanel">
    <h3>
      <span id="historyTitle">📋 计算历史</span>
      <span class="h-actions">
        <button id="clearHistory">清空</button>
        <button class="close-btn" id="closeHistory" title="关闭">✕</button>
      </span>
    </h3>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- 进制转换面板 -->
  <div class="panel-base prog-panel" id="progPanel">
    <h3>
      <span>💻 进制与位运算</span>
      <button class="close-btn" id="closeProg" title="关闭">✕</button>
    </h3>
    <div class="panel-body">
      <div class="panel-row">
        <label>十进制 DEC</label>
        <input type="text" id="progDec" placeholder="0">
      </div>
      <div class="panel-row">
        <label>十六进制 HEX</label>
        <input type="text" id="progHex" placeholder="0">
      </div>
      <div class="panel-row">
        <label>八进制 OCT</label>
        <input type="text" id="progOct" placeholder="0">
      </div>
      <div class="panel-row">
        <label>二进制 BIN</label>
        <input type="text" id="progBin" placeholder="0" class="mono">
      </div>
      <div class="panel-sub">字长：
        <select id="progWord">
          <option value="8">8 位</option>
          <option value="16">16 位</option>
          <option value="32" selected>32 位</option>

<!-- 复制成功提示 -->
<div class="toast" id="toast"></div>

<script>
  const resultEl = document.getElementById('result');
  const exprEl   = document.getElementById('expr');
  const mascotEl = document.getElementById('mascot');
  let current = '0';
  let overwrite = true;
  let storedValue = null;
  let pendingOp = null;
  let lastRhs = null;
  let justCalculated = false;
  let history = [];
  let memory = 0;
  let degMode = true;
  let soundEnabled = true;

  const mascots = {
    idle:    ['(´｡• ᵕ •｡`)', '(◕‿◕✿)', '(≧▽≦)', '(｡♥‿♥｡)', '(｡◕‿◕｡)', '(✿◡‿◡)'],
    calc:    ['(ง •_•)ง', 'ヽ(•‿•)ノ', '(◕ᴗ◕✿)', '┗|｀*•.¸)┓'],
    happy:   ['(★^O^★)', '(✿◡‿◡)', '(ﾉ◕ヮ◕)ﾉ*:･ﾟ✧', '♪(^∇^*)', '(ﾉ´ヮ`)ﾉ*: ･ﾟ', '(˘▾˘)~♪'],
    error:   ['(╥﹏╥)', '(＃`Д´)', '(¬_¬)', '(╯°□°)╯'],
    zero:    ['(⊙_⊙)', '(；´Д｀)', 'ε=ε=ε=┌(;*´Д`)ﾉ', '(´-ω-`)'],
    big:     ['(☉_☉)', '(✪ω✪)', '∑d(⌐■_■)', '( ﾟдﾟ)'],
    pi:      ['🥧(◕‿◕)', '(◕ᴗ◕)π', '~(>_<~)π'],
    night:   ['(🌙- _)ᐝ', '(´-ω-｀)💤', '(-_-)💤'],
    hi:      ['(・∀・)', '(✿◠‿◠)', '( ´ ▽ ` )ノ'],
    wave:    ['(手)•ᴗ•`)', '( ´ ▽ ` )ﾉ', '(◕‿◕)ﾉ'],
    think:   ['(🤔)', '(｡•́︿•̀｡)', '(・_・;)'],
    love:    ['(♡˙︶˙♡)', '(´∀`)♡', '(｡♡‿♡｡)'],
    dance:   ['(~‾▿‾)~', '┏(-_-)┛', '(ﾉ◕ω◕)ﾉ']
  };

  // ===== 音效系统 =====
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) { audioCtx = null; }
    }
    return audioCtx;
  }
  // ===== 音效系统（采样 + 合成双引擎）=====
  // 采样音效：真实录音（数字键/运算符/等号/清除/错误/开心/pop/whoosh/提示）
  const SAMPLE_KEYS = ['click','op','equal','clear','error','happy','pop','whoosh','notice'];
  const sampleBuffers = {};
  let samplesReady = false;

  async function loadSamples() {
    if (samplesReady) return;
    try {
      const SR = 44100;
      // 内嵌采样：将 WAV 转成 base64 打包，运行时解码
      const blobs = {};
      // 用 fetch 加载同目录 wav 文件（离线时回退到合成）
      const tasks = SAMPLE_KEYS.map(async (k) => {
        try {
          const r = await fetch('sounds/kawaii_' + k + '.wav', { cache: 'force-cache' });
          if (r.ok) {
            const ab = await r.arrayBuffer();
            sampleBuffers[k] = await getAudioCtx().decodeAudioData(ab.slice(0));
          }
        } catch(e) {}
      });
      await Promise.all(tasks);
      samplesReady = true;
    } catch(e) { samplesReady = false; }
  }
  // 页面加载后静默预加载
  window.addEventListener('load', () => { setTimeout(loadSamples, 300); });
  // 首次交互时立即加载
  ['click','touchstart','keydown'].forEach(ev => {
    document.addEventListener(ev, () => { if (!samplesReady) loadSamples(); }, { once: true, passive: true });
  });

  // 备用合成音（离线/加载失败时兜底）
  function synthSound(type) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    const now = ctx.currentTime;
    const M = {
      'click':   { f: 1320, d: 0.06, t: 'triangle', v: 0.16 },
      'op':      { f: 660,  d: 0.08, t: 'sine',     v: 0.14 },
      'equal':   { f: 1200, d: 0.1,  t: 'sine',     v: 0.16 },
      'clear':   { f: 500,  d: 0.12, t: 'triangle', v: 0.14 },
      'error':   { f: 200,  d: 0.18, t: 'sawtooth', v: 0.14 },
      'happy':   { f: 1500, d: 0.12, t: 'sine',     v: 0.16 },
      'pop':     { f: 900,  d: 0.05, t: 'sine',     v: 0.12 },
      'whoosh':  { f: 400,  d: 0.12, t: 'sine',     v: 0.13 },
      'notice':  { f: 1568, d: 0.13, t: 'sine',     v: 0.15 }
    };
    const c = M[type] || M['click'];
    osc.type = c.t;
    osc.frequency.setValueAtTime(c.f, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(60, c.f * 0.5), now + c.d);
    gain.gain.setValueAtTime(c.v * getKeyVol(), now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + c.d);
    osc.start(now); osc.stop(now + c.d);
  }

  function playSampleSound(type) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const buf = sampleBuffers[type];
    if (!buf) { synthSound(type); return; }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    g.gain.value = getKeyVol();
    src.connect(g); g.connect(ctx.destination);
    src.start();
  }

  // 音量配置
  let volMaster = 0.7, volKey = 1.0, volVoice = 0.9;
  function getKeyVol() { return Math.min(1, volMaster * volKey); }
  function getVoiceVol() { return Math.min(1, volMaster * volVoice); }

  // 按键音效预设（数字键、运算符、等号等走这个音色）
  const KEY_SOUNDS = {
    cute:    { name: '软萌短促', emoji: '🍬', base: 'click' },
    crystal: { name: '水晶铃音', emoji: '🔔', base: 'notice' },
    pop:     { name: '气泡弹跳', emoji: '🫧', base: 'pop' },
    warm:    { name: '圆润温暖', emoji: '🧸', base: 'op' },
    retro:   { name: '复古电子', emoji: '👾', base: 'equal' },
    none:    { name: '静音',     emoji: '🤫', base: null }
  };
  let keySound = 'cute';

  function playKeySound(type) {
    if (!soundEnabled) return;
    if (KEY_SOUNDS[keySound].base === null) return;
    playSampleSound(KEY_SOUNDS[keySound].base || type);
  }

  // 萝莉语音
  const VOICE_LINES = {
    ok:    { name: '算对啦',     emoji: '🎀', file: 'loli_ok.wav' },
    oops:  { name: '呜哇出错啦', emoji: '😣', file: 'loli_oops.wav' },
    hi:    { name: '嗨~',        emoji: '👋', file: 'loli_hi.wav' },
    love:  { name: '喜欢你哦',   emoji: '💕', file: 'loli_love.wav' },
    huh:   { name: '嗯？',       emoji: '🤔', file: 'loli_huh.wav' },
    wow:   { name: '好厉害',     emoji: '✨', file: 'loli_wow.wav' },
    night: { name: '晚安',       emoji: '🌙', file: 'loli_night.wav' }
  };
  let voiceEnabled = true;
  const voiceBuffers = {};
  let voicesReady = false;

  async function loadVoices() {
    if (voicesReady) return;
    try {
      const tasks = Object.keys(VOICE_LINES).map(async (k) => {
        try {
          const r = await fetch('sounds/' + VOICE_LINES[k].file, { cache: 'force-cache' });
          if (r.ok) {
            const ab = await r.arrayBuffer();
            voiceBuffers[k] = await getAudioCtx().decodeAudioData(ab.slice(0));
          }
        } catch(e) {}
      });
      await Promise.all(tasks);
      voicesReady = true;
    } catch(e) { voicesReady = false; }
  }
  window.addEventListener('load', () => { setTimeout(loadVoices, 400); });
  ['click','touchstart','keydown'].forEach(ev => {
    document.addEventListener(ev, () => { if (!voicesReady) loadVoices(); }, { once: true, passive: true });
  });

  function speak(line) {
    if (!soundEnabled || !voiceEnabled) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const buf = voiceBuffers[line];
    if (!buf) return;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    g.gain.value = getVoiceVol();
    src.connect(g); g.connect(ctx.destination);
    src.start();
  }

  // 对外统一接口
  function playSound(type) {
    if (!soundEnabled) return;
    if (type === 'voice_hi') { speak('hi'); return; }
    if (type === 'voice_love') { speak('love'); return; }
    playKeySound(type);
  }

  // ===== 表情系统 =====
  let mascotTimer = null;
  let petCount = 0;
  let lastState = 'idle';
  let idleTimer = null;

  function setMood(state, effect) {
    const arr = mascots[state] || mascots.idle;
    const text = arr[Math.floor(Math.random() * arr.length)];
    mascotEl.textContent = text;
    mascotEl.className = 'mascot' + (effect ? ' ' + effect : '');
    lastState = state;
    if (effect) {
      setTimeout(() => { if (mascotEl.className.includes(effect)) mascotEl.className = 'mascot'; }, 700);
    }
    clearTimeout(mascotTimer);
    mascotTimer = setTimeout(() => { if (lastState !== 'happy') { setMood('idle'); } }, 4000);
  }

  // 空闲时随机换表情
  function startIdleMood() {
    clearInterval(idleTimer);
    idleTimer = setInterval(() => {
      if (lastState === 'idle' && Math.random() > 0.5) {
        setMood('idle');
      }
    }, 3500);
  }

  setMood('hi');
  setTimeout(() => setMood('idle'), 2000);
  startIdleMood();

  mascotEl.addEventListener('click', () => {
    petCount++;
    playSound('happy');
    if (petCount >= 10) {
      setMood('love', 'heart');
      showToast('呜哇～最喜欢你了！(' + petCount + '次摸摸)');
      petCount = 0;
    } else if (petCount >= 5) {
      setMood('happy', 'heart');
      showToast('好痒呀～(' + petCount + '次摸摸)');
    } else if (petCount >= 3) {
      setMood('wave', 'popBig');
      showToast('嘿嘿，继续摸 (' + petCount + '次)');
    } else {
      setMood('wave', 'popBig');
      const msgs = ['嗨呀～', '摸到我啦！', 'ヾ(≧∇≦*)', '好开心～', '再来一下嘛～'];
      showToast(msgs[petCount - 1] || '嗨！');
    }
  });

  // ===== 数学工具 =====
  function fixFloat(n) {
    if (typeof n !== 'number' || !isFinite(n)) return n;
    return parseFloat(n.toPrecision(12));
  }

  function fmt(n) {
    if (n === '' || n === undefined || n === null) return '';
    const num = fixFloat(Number(n));
    if (typeof num !== 'number' || isNaN(num)) return String(n);
    if (!isFinite(num)) return '∞';
    if (Math.abs(num) > 1e15 || (Math.abs(num) < 1e-9 && num !== 0)) return num.toExponential(8);
    let s = String(num);
    if (s.includes('.') && s.split('.')[1].length > 10) {
      s = String(parseFloat(num.toFixed(10)));
    }
    return s;
  }

  function safeEval(expr) {
    const safe = String(expr).replace(/[^-()\d/*+.]/g, '').replace(/(\.\d*)\./g, '$1');
    if (!safe || /[+\-*/.]{2,}/.test(safe.replace(/\d*\.\d*/g, ''))) throw new Error('表达式不完整');
    const val = Function('"use strict";return (' + safe + ')')();
    if (!isFinite(val)) throw new Error('无穷或溢出');
    return val;
  }

  function factorial(n) {
    if (n < 0) throw new Error('负数无阶乘');
    if (n > 170) throw new Error('数值过大');
    if (n % 1 !== 0) throw new Error('需为整数');
    if (n === 0 || n === 1) return 1;
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  }

  function toRad(x) { return degMode ? x * Math.PI / 180 : x; }
  function updateDegBtn() {
    const btn = document.getElementById('degBtn');
    if (btn) btn.textContent = degMode ? 'DEG' : 'RAD';
  }

  // ===== 输入处理 =====
  function input(k) {
    if (k >= '0' && k <= '9') {
      if (overwrite || current === '0') { current = k; overwrite = false; }
      else { if (current.replace(/,/g,'').length < 14) current += k; }
      justCalculated = false;
      playSound('pop');
    } else if (k === '.') {
      if (overwrite) { current = '0.'; overwrite = false; }
      else if (!current.includes('.')) current += '.';
      justCalculated = false;
      playSound('pop');
    } else if (k === 'back') {
      if (overwrite) return;
      current = current.length > 1 ? current.slice(0, -1) : '0';
      justCalculated = false;
      playSound('pop');
    } else if (k === 'C') {
      current = '0'; overwrite = true; exprEl.textContent = '';
      storedValue = null; pendingOp = null; lastRhs = null; justCalculated = false;
      playSound('clear');
    } else if (k === 'C') {
      setMood('idle');
    } else if (k === '%') {
      current = fmt(Number(current) / 100);
      setMood('calc', 'popBig');
      playSound('pop');
      justCalculated = false;
    } else if (k === '±') {
      if (current === '0') return;
      current = current.startsWith('-') ? current.slice(1) : '-' + current;
      justCalculated = false;
      playSound('pop');
    } else if (k === 'rand') {
      current = fmt(Math.random());
      overwrite = true;
      justCalculated = false;
      setMood('dance', 'sparkle');
      playSound('happy');
    } else if (k === 'round') {
      current = fmt(Math.round(Number(current)));
      overwrite = true; justCalculated = true;
      playSound('pop');
    } else if (k === 'ceil') {
      current = fmt(Math.ceil(Number(current)));
      overwrite = true; justCalculated = true;
      playSound('pop');
    } else if (k === 'floor') {
      current = fmt(Math.floor(Number(current)));
      overwrite = true; justCalculated = true;
      playSound('pop');
    } else if (k === 'cbrt') {
      const x = Number(current);
      current = fmt(Math.cbrt(x));
      exprEl.textContent = '∛(' + fmt(x) + ') =';
      overwrite = true; justCalculated = true;
      setMood('happy', 'sparkle');
      playSound('happy');
    } else if (k === 'sinh') {
      const x = Number(current);
      current = fmt(Math.sinh(x));
      exprEl.textContent = 'sinh(' + fmt(x) + ') =';
      overwrite = true; justCalculated = true;
      playSound('happy');
    } else if (k === 'cosh') {
      const x = Number(current);
      current = fmt(Math.cosh(x));
      exprEl.textContent = 'cosh(' + fmt(x) + ') =';
      overwrite = true; justCalculated = true;
      playSound('happy');
    } else if (k === 'tanh') {
      const x = Number(current);
      current = fmt(Math.tanh(x));
      exprEl.textContent = 'tanh(' + fmt(x) + ') =';
      overwrite = true; justCalculated = true;
      playSound('happy');
    } else if (k === 'mod') {
      storedValue = Number(current);
      pendingOp = '%';
      exprEl.textContent = current + ' mod ';
      overwrite = true;
      justCalculated = false;
      playSound('op');
    } else if (k === 'nPr') {
      storedValue = Number(current);
      pendingOp = 'nPr';
      exprEl.textContent = current + ' P ';
      overwrite = true;
      justCalculated = false;
      playSound('op');
    } else if (k === 'nCr') {
      storedValue = Number(current);
      pendingOp = 'nCr';
      exprEl.textContent = current + ' C ';
      overwrite = true;
      justCalculated = false;
      playSound('op');
    } else if (k === 'M+') {
      memory = Number(current);
      showToast('已存入记忆: ' + fmt(memory));
      playSound('pop');
    } else if (k === 'MR') {
      current = fmt(memory);
      overwrite = true;
      justCalculated = false;
      playSound('pop');
    } else if (k === 'MC') {
      memory = 0;
      showToast('记忆已清除');
      playSound('clear');
    } else if (k === 'deg') {
      degMode = !degMode;
      updateDegBtn();
      showToast(degMode ? '角度模式 (DEG)' : '弧度模式 (RAD)');
      playSound('pop');
    } else if (k === 'pow') {
      storedValue = Number(current);
      pendingOp = '**';
      exprEl.textContent = current + ' ^ ';
      overwrite = true;
      justCalculated = false;
      playSound('op');
    } else if (['sin','cos','tan','asin','acos','atan','sqrt','sq','cube','inv','log','ln','fact','abs','exp','tenPow','twoPow'].includes(k)) {
      const x = Number(current);
      let val, exprText;
      try {
        switch (k) {
          case 'sin': val = Math.sin(toRad(x)); exprText = `sin(${fmt(x)})`; break;
          case 'cos': val = Math.cos(toRad(x)); exprText = `cos(${fmt(x)})`; break;
          case 'tan': val = Math.tan(toRad(x)); exprText = `tan(${fmt(x)})`; break;
          case 'asin': if (x < -1 || x > 1) throw new Error('范围[-1,1]'); val = Math.asin(x) * (degMode ? 180/Math.PI : 1); exprText = `sin⁻¹(${fmt(x)})`; break;
          case 'acos': if (x < -1 || x > 1) throw new Error('范围[-1,1]'); val = Math.acos(x) * (degMode ? 180/Math.PI : 1); exprText = `cos⁻¹(${fmt(x)})`; break;
          case 'atan': val = Math.atan(x) * (degMode ? 180/Math.PI : 1); exprText = `tan⁻¹(${fmt(x)})`; break;
          case 'sqrt': if (x < 0) throw new Error('负数不能开方'); val = Math.sqrt(x); exprText = `√(${fmt(x)})`; break;
          case 'sq': val = x * x; exprText = `sqr(${fmt(x)})`; break;
          case 'cube': val = x * x * x; exprText = `cube(${fmt(x)})`; break;
          case 'inv': if (x === 0) throw new Error('不能除以0'); val = 1 / x; exprText = `1/(${fmt(x)})`; break;
          case 'log': if (x <= 0) throw new Error('需为正数'); val = Math.log10(x); exprText = `log(${fmt(x)})`; break;
          case 'ln': if (x <= 0) throw new Error('需为正数'); val = Math.log(x); exprText = `ln(${fmt(x)})`; break;
          case 'fact': val = factorial(x); exprText = `${fmt(x)}!`; break;
          case 'abs': val = Math.abs(x); exprText = `|${fmt(x)}|`; break;
          case 'exp': val = Math.exp(x); exprText = `e^(${fmt(x)})`; break;
          case 'tenPow': val = Math.pow(10, x); exprText = `10^(${fmt(x)})`; break;
          case 'twoPow': val = Math.pow(2, x); exprText = `2^(${fmt(x)})`; break;
        }
        current = fmt(val);
        exprEl.textContent = exprText + ' =';
        addHistory(exprText + ' =', current);
        overwrite = true;
        justCalculated = true;
        setMood('happy', 'sparkle');
        playSound('happy');
      } catch(err) {
        current = err.message || '表达式错误';
        overwrite = true;
        justCalculated = false;
        setMood('error', 'shake');
      }
    } else if (k === 'pi') {
      current = fmt(Math.PI);
      overwrite = true;
      justCalculated = false;
      setMood('pi', 'spin');
      playSound('pop');
    } else if (k === 'e') {
      current = fmt(Math.E);
      overwrite = true;
      justCalculated = false;
      playSound('pop');
    } else if ('+-*/'.includes(k)) {
      const num = Number(current);
      const sym = { '+':'+','-':'−','*':'×','/':'÷' }[k];
      if (justCalculated) {
        pendingOp = k;
        storedValue = Number(current);
        exprEl.textContent = fmt(storedValue) + ' ' + sym + ' ';
        justCalculated = false;
      } else if (pendingOp !== null && overwrite) {
        pendingOp = k;
        exprEl.textContent = fmt(storedValue) + ' ' + sym + ' ';
      } else if (pendingOp !== null && storedValue !== null) {
        try {
          const next = safeEval(storedValue + ' ' + pendingOp + ' ' + num);
          current = fmt(next);
          storedValue = next;
          pendingOp = k;
          exprEl.textContent = fmt(next) + ' ' + sym + ' ';
        } catch(err) {
          current = '表达式错误';
          storedValue = null; pendingOp = null; lastRhs = null;
          setMood('error');
        }
      } else {
        storedValue = num;
        pendingOp = k;
        exprEl.textContent = current + ' ' + sym + ' ';
      }
      overwrite = true;
      playSound('op');
    } else if (k === '=') {
      if (pendingOp === null || storedValue === null) return;
      const num = justCalculated ? lastRhs : Number(current);
      const sym = { '+':'+','-':'−','*':'×','/':'÷','**':'^' }[pendingOp];
      try {
        setMood('calc');
        playSound('equal');
        let val;
        if (pendingOp === '**') val = Math.pow(storedValue, num);
        else if (pendingOp === '%') {
          if (num === 0) throw new Error('除数不能为0');
          val = storedValue % num;
        }
        else if (pendingOp === 'nPr') {
          if (storedValue < 0 || num < 0 || num > storedValue || storedValue % 1 !== 0 || num % 1 !== 0) throw new Error('需满足 n≥r≥0 且为整数');
          val = factorial(storedValue) / factorial(storedValue - num);
        }
        else if (pendingOp === 'nCr') {
          if (storedValue < 0 || num < 0 || num > storedValue || storedValue % 1 !== 0 || num % 1 !== 0) throw new Error('需满足 n≥r≥0 且为整数');
          val = factorial(storedValue) / (factorial(num) * factorial(storedValue - num));
        }
        else val = safeEval(storedValue + ' ' + pendingOp + ' ' + num);
        const exprText = sym === '^' ? fmt(storedValue) + ' ^ ' + fmt(num) : fmt(storedValue) + ' ' + sym + ' ' + fmt(num);
        exprEl.textContent = exprText + ' =';
        current = fmt(val);
        addHistory(exprText + ' =', current);
        if (!justCalculated) lastRhs = num;
        if (pendingOp === '**') { storedValue = val; pendingOp = null; lastRhs = null; }
        else { storedValue = val; lastRhs = justCalculated ? lastRhs : num; }
        overwrite = true;
        justCalculated = true;
        // 彩蛋
        const n = Number(current);
        if (current === '42') {
          setMood('love', 'sparkle');
          showToast('生命、宇宙及一切的终极答案是 42！');
          confettiBurst();
        } else if (current === '0') {
          setMood('zero', 'shake');
        } else if (current === '520') {
          setMood('love', 'heart');
          showToast('520～ 我也爱你！');
        } else if (current === '1314') {
          setMood('love', 'heart');
          showToast('一生一世 1314 ♡');
        } else if (Math.abs(n) > 1e12) {
          setMood('big', 'popBig');
          confetti();
        } else if (n < 0) {
          confetti();
          setMood('happy');
        } else {
          confetti();
          setMood('happy');
        }
      } catch(err) {
        current = err.message === '无穷或溢出' ? '不能除以0' : '表达式错误';
        storedValue = null; pendingOp = null; lastRhs = null;
        overwrite = true;
        justCalculated = false;
        setMood('zero', 'shake');
        playSound('error');
      }
    }
    resultEl.textContent = current;
    resultEl.classList.remove('pop');
    void resultEl.offsetWidth;
    resultEl.classList.add('pop');
  }

  function renderUnitPanel() {
    const cat = units[currentUnitCat];
    const body = document.getElementById('unitBody');
    if (cat.special && currentUnitCat === 'temp') {
      body.innerHTML = `
        <div class="unit-row">
          <label>℃ 摄氏</label>
          <input type="number" id="u_c" placeholder="摄氏度" value="0">
        </div>
        <div class="unit-row">
          <label>℉ 华氏</label>
          <input type="number" id="u_f" placeholder="华氏度">
        </div>
        <div class="unit-row">
          <label>K 开尔文</label>
          <input type="number" id="u_k" placeholder="开尔文">
        </div>
      `;
      const cInput = document.getElementById('u_c');
      const fInput = document.getElementById('u_f');
      const kInput = document.getElementById('u_k');
      cInput.addEventListener('input', () => {
        const c = parseFloat(cInput.value);
        if (isNaN(c)) { fInput.value=''; kInput.value=''; return; }
        fInput.value = fmt(c * 9/5 + 32);
        kInput.value = fmt(c + 273.15);
      });
      fInput.addEventListener('input', () => {
        const f = parseFloat(fInput.value);
        if (isNaN(f)) { cInput.value=''; kInput.value=''; return; }
        cInput.value = fmt((f - 32) * 5/9);
        kInput.value = fmt((f - 32) * 5/9 + 273.15);
      });
      kInput.addEventListener('input', () => {
        const k = parseFloat(kInput.value);
        if (isNaN(k)) { cInput.value=''; fInput.value=''; return; }
        cInput.value = fmt(k - 273.15);
        fInput.value = fmt((k - 273.15) * 9/5 + 32);
      });
    } else {
      const unitKeys = Object.keys(cat.units);
      let html = '';
      unitKeys.forEach(k => {
        html += `<div class="unit-row">
          <label>${cat.labels[k]}</label>
          <input type="number" data-unit="${k}" data-cat="${currentUnitCat}" placeholder="${cat.labels[k]}" value="">
        </div>`;
      });
      body.innerHTML = html;
      body.querySelectorAll('input[data-unit]').forEach(input => {
        input.addEventListener('input', () => {
          const val = parseFloat(input.value);
          const srcUnit = input.dataset.unit;
          if (isNaN(val)) {
            body.querySelectorAll('input[data-unit]').forEach(other => { if (other !== input) other.value = ''; });
            return;
          }
          const srcBase = val * cat.units[srcUnit];
          body.querySelectorAll('input[data-unit]').forEach(other => {
            if (other !== input) {
              const targetUnit = other.dataset.unit;
              other.value = fmt(srcBase / cat.units[targetUnit]);
            }
          });
        });
      });
    }
  }

  // ===== 日期计算 =====
  function calcDateDiff(d1, d2) {
    const ms = Math.abs(d2 - d1);
    const days = Math.floor(ms / 86400000);
    const weeks = Math.floor(days / 7);
    const years = Math.floor(days / 365.25);
    let result = `相差 <b>${days}</b> 天`;
    if (weeks > 0) result += `（约 ${weeks} 周）`;
    if (years > 0) result += `（约 ${fmt(years)} 年）`;
    return result;
  }

  function bindDateCalc() {
    const startEl = document.getElementById('dateStart');
    const endEl = document.getElementById('dateEnd');
    const offsetEl = document.getElementById('dateOffset');
    const resultDiv = document.getElementById('dateResult');
    const calcBtn = document.getElementById('calcDate');

    // 默认填入今天
    const today = new Date().toISOString().split('T')[0];
    if (!startEl.value) startEl.value = today;
    if (!endEl.value) {
      const tmr = new Date(Date.now() + 86400000).toISOString().split('T')[0];
      endEl.value = tmr;
    }

    calcBtn.addEventListener('click', () => {
      const d1 = new Date(startEl.value);
      const d2 = new Date(endEl.value);
      const offset = parseInt(offsetEl.value);

      if (startEl.value && endEl.value && !isNaN(d1) && !isNaN(d2)) {
        let html = `<div>${d1.toLocaleDateString('zh-CN')} → ${d2.toLocaleDateString('zh-CN')}</div>`;
        html += `<div style="margin-top:6px;font-size:18px;">${calcDateDiff(d1, d2)}</div>`;
        if (!isNaN(offset)) {
          const newDate = new Date(d1.getTime() + offset * 86400000);
          html += `<div style="margin-top:6px;font-size:14px;color:#c98fb0;">${startEl.value} ${offset>=0?'+':'-'} ${Math.abs(offset)}天 = ${newDate.toLocaleDateString('zh-CN')}</div>`;
        }
        resultDiv.innerHTML = html;
        setMood('happy', 'sparkle');
        playSound('happy');
      } else {
        resultDiv.textContent = '请选择有效的日期哦～';
        setMood('wave');
        playSound('error');
      }
    });
  }

  // ===== 本地存储 =====
  function saveData() {
    try {
      localStorage.setItem('calc_history', JSON.stringify(history));
      localStorage.setItem('calc_memory', String(memory));
      localStorage.setItem('calc_theme', document.body.classList.contains('theme-dark') ? 'dark' : 'light');
      localStorage.setItem('calc_bg_index', String(bgIndex));
      localStorage.setItem('calc_sound', soundEnabled ? 'on' : 'off');
      localStorage.setItem('calc_vol_master', String(volMaster));
      localStorage.setItem('calc_vol_key', String(volKey));
      localStorage.setItem('calc_vol_voice', String(volVoice));
      localStorage.setItem('calc_key_sound', keySound);
      localStorage.setItem('calc_voice_on', voiceEnabled ? '1' : '0');
    } catch(e) {}
  }
  function loadData() {
    try {
      const h = localStorage.getItem('calc_history');
      if (h) history = JSON.parse(h);
      const m = localStorage.getItem('calc_memory');
      if (m) memory = Number(m);
      const t = localStorage.getItem('calc_theme');
      if (t === 'dark') {
        document.body.classList.add('theme-dark');
        const tb = document.getElementById('toggleTheme');
        if (tb) tb.textContent = '☀️ 亮色';
      }
      const bi = localStorage.getItem('calc_bg_index');
      if (bi !== null) {
        bgIndex = Number(bi) % bgLight.length;
        const dark = document.body.classList.contains('theme-dark');
        const list = dark ? bgDark : bgLight;
        const idx = bgIndex % list.length;
        document.body.style.backgroundImage = `url('${list[idx]}')`;
      }
      const s = localStorage.getItem('calc_sound');
      if (s === 'off') {
        soundEnabled = false;
        const sb = document.getElementById('toggleSound');
        if (sb) { sb.textContent = '🔕 静音'; sb.className = 'sound-off'; }
      }
      const vm = Number(localStorage.getItem('calc_vol_master'));
      if (vm) { volMaster = vm; const e = document.getElementById('volMaster'); if (e) { e.value = Math.round(vm*100); document.getElementById('volMasterVal').textContent = Math.round(vm*100)+'%'; } }
      const vk = Number(localStorage.getItem('calc_vol_key'));
      if (vk) { volKey = vk; const e = document.getElementById('volKey'); if (e) { e.value = Math.round(vk*100); document.getElementById('volKeyVal').textContent = Math.round(vk*100)+'%'; } }
      const vv = Number(localStorage.getItem('calc_vol_voice'));
      if (vv) { volVoice = vv; const e = document.getElementById('volVoice'); if (e) { e.value = Math.round(vv*100); document.getElementById('volVoiceVal').textContent = Math.round(vv*100)+'%'; } }
      const ks = localStorage.getItem('calc_key_sound');
      if (ks && KEY_SOUNDS[ks]) keySound = ks;
      if (localStorage.getItem('calc_voice_on') === '0') voiceEnabled = false;
      updateDegBtn();
      renderHistory();
    } catch(e) {}
  }

  // ===== 键盘支持 =====
  document.addEventListener('keydown', e => {
    // 如果焦点在输入框内，不拦截
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    if (e.key === 'Escape') {
      const calc = document.getElementById('calc').classList;
      if (calc.contains('show-history')) { closeHistory(); e.preventDefault(); return; }
      if (calc.contains('show-unit')) { closeUnitPanel(); e.preventDefault(); return; }
      if (calc.contains('show-date')) { closeDatePanel(); e.preventDefault(); return; }
      if (calc.contains('show-prog')) { closeProgPanel(); e.preventDefault(); return; }
      if (calc.contains('show-stats')) { closeStatsPanel(); e.preventDefault(); return; }
      if (calc.contains('show-eq')) { closeEqPanel(); e.preventDefault(); return; }
      if (calc.contains('show-geo')) { closeGeoPanel(); e.preventDefault(); return; }
      if (calc.contains('show-fin')) { closeFinPanel(); e.preventDefault(); return; }
      if (calc.contains('show-graph')) { closeGraphPanel(); e.preventDefault(); return; }
      if (calc.contains('show-sound')) { closeSoundPanel(); e.preventDefault(); return; }
    }
    const map = { Enter:'=', '=':'=', Backspace:'back', Delete:'C' };
    let k = e.key;
    if (map[k]) k = map[k];
    if ('0123456789+-*/.'.includes(k)) { e.preventDefault(); input(k); }
    else if (k === 'Enter') { e.preventDefault(); input('='); }
    else if (k === 'h' || k === 'H') { e.preventDefault(); toggleHistoryPanel(); }
    else if (k === 's' || k === 'S') { e.preventDefault(); document.getElementById('toggleSci').click(); }
    else if (k === 't' || k === 'T') { e.preventDefault(); document.getElementById('toggleTheme').click(); }
    else if (k === 'b' || k === 'B') { e.preventDefault(); document.getElementById('toggleBg').click(); }
    else if (k === 'u' || k === 'U') { e.preventDefault(); document.getElementById('toggleUnit').click(); }
    else if (k === 'd' || k === 'D') { e.preventDefault(); document.getElementById('toggleDate').click(); }

  // ===== 进制与位运算面板 =====
  let progWord = 32, progSigned = true;
  function maskBig(v) {
    // 按字长+有符号补码截断
    const bits = progWord;
    const max = BigInt(1) << BigInt(bits);
    let b = BigInt(v) % max;
    if (b < 0n) b += max;
    if (progSigned && b >= (BigInt(1) << BigInt(bits - 1))) {
      b -= max;
    }
    return b;
  }
  function fmtBase(n, base) {
    try {
      let b = BigInt(n);
      const max = BigInt(1) << BigInt(progWord);
      if (progSigned) {
        const half = BigInt(1) << BigInt(progWord - 1);
        if (b >= half) b -= max;
      }
      let u = b < 0n ? b + max : b;
      return u.toString(base).toUpperCase();
    } catch(e) { return '0'; }
  }
  function syncProgFromDec() {
    const decEl = document.getElementById('progDec');
    const v = decEl.value.trim();
    if (v === '') { ['progHex','progOct','progBin'].forEach(id => document.getElementById(id).value = ''); return; }
    let n;
    try { n = BigInt(v); } catch(e) { return; }
    document.getElementById('progHex').value = fmtBase(n, 16);
    document.getElementById('progOct').value = fmtBase(n, 8);
    document.getElementById('progBin').value = fmtBase(n, 2);
  }
  function syncProgFrom(otherBase) {
    const el = document.getElementById('prog' + otherBase);
    const v = el.value.trim();
    if (v === '') { document.getElementById('progDec').value = ''; syncProgFromDec(); return; }
    try {
      const n = BigInt(otherBase === 'Hex' ? '0x' + v : otherBase === 'Oct' ? '0o' + v : '0b' + v);
      document.getElementById('progDec').value = fmtBase(n, 10);
      syncProgFromDec();
    } catch(e) {}
  }
  function bindProgPanel() {
    const ids = ['progDec','progHex','progOct','progBin'];
    ids.forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        const key = id.replace('prog', '');
        if (key === 'Dec') syncProgFromDec();
        else syncProgFrom(key);
      });
    });
    document.getElementById('progWord').addEventListener('change', e => { progWord = Number(e.target.value); syncProgFromDec(); });
    document.getElementById('progSigned').addEventListener('change', e => { progSigned = e.target.checked; syncProgFromDec(); });

    // 位运算
    document.querySelectorAll('[data-bit]').forEach(btn => {
      btn.addEventListener('click', () => {
        playSound('op');
        const op = btn.dataset.bit;
        let a, b;
        try { a = BigInt(document.getElementById('progA').value); } catch(e) { a = 0n; }
        try { b = BigInt(document.getElementById('progB').value); } catch(e) { b = 0n; }
        const n = Number(document.getElementById('progn').value) || 0;
        const max = BigInt(1) << BigInt(progWord);
        let r;
        const mask = (x) => { let v = x % max; if (v < 0n) v += max; return v; };
        switch (op) {
          case 'and': r = mask(a & b); break;
          case 'or':  r = mask(a | b); break;
          case 'xor': r = mask(a ^ b); break;
          case 'not': r = mask(~a); break;
          case 'shl': r = mask(a << BigInt(n)); break;
          case 'shr': r = a >= 0n ? mask(a >> BigInt(n)) : mask((a + max) >> BigInt(n)); break;
        }
        let signed = r;
        if (progSigned && r >= (BigInt(1) << BigInt(progWord - 1))) signed = r - max;
        const out = `DEC: ${signed}\nHEX: 0x${r.toString(16).toUpperCase().padStart(Math.ceil(progWord/4),'0')}\nOCT: 0${r.toString(8)}\nBIN: ${r.toString(2).padStart(progWord,'0')}`;
        document.getElementById('progResult').innerHTML = `<span class="lbl">A</span> = ${a} <span class="lbl">B</span> = ${b}\n\n<span class="lbl">${op.toUpperCase()}</span> 结果:\n${out}`;

      const n = data.length;
      const sum = data.reduce((a, b) => a + b, 0);
      const mean = sum / n;
      const sq = data.reduce((a, b) => a + b * b, 0);
      const popVar = sq / n - mean * mean;
      const popStd = Math.sqrt(Math.max(popVar, 0));
      const sampVar = n > 1 ? sq / (n - 1) - sum * sum / (n * (n - 1)) : 0;
      const sampStd = Math.sqrt(Math.max(sampVar, 0));
      const sorted = [...data].sort((a, b) => a - b);
      const q = (p) => { const pos = (sorted.length - 1) * p, base = Math.floor(pos), rest = pos - base; return sorted[base + 1] !== undefined ? sorted[base] + rest * (sorted[base + 1] - sorted[base]) : sorted[base]; };
      const median = sorted.length % 2 ? sorted[(sorted.length - 1) / 2] : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2;
      const pv = (data.reduce((s, v) => s + Math.pow(v - mean, 3), 0) / n) / Math.pow(popStd || 1, 3);
      const pk = (data.reduce((s, v) => s + Math.pow(v - mean, 4), 0) / n) / Math.pow(popVar || 1, 2);

<span class="lbl">Q1 / Q3</span> = <span class="num">${fmt(q(.25))} / ${fmt(q(.75))}</span>
<span class="lbl">极差</span> = <span class="num">${fmt(sorted[n-1] - sorted[0])}</span>
<span class="lbl">总体方差 σ²</span> = <span class="num">${fmt(popVar)}</span>
<span class="lbl">总体标准差 σ</span> = <span class="num">${fmt(popStd)}</span>
<span class="lbl">样本方差 s²</span> = <span class="num">${fmt(sampVar)}</span>
<span class="lbl">样本标准差 s</span> = <span class="num">${fmt(sampStd)}</span>
<span class="lbl">变异系数 CV</span> = <span class="num">${mean ? fmt(popStd / Math.abs(mean) * 100) + '%' : '—'}</span>

      out.innerHTML = html;

  function solveQuad(a, b, c) {
    if (a === 0) {
      if (b === 0) return c === 0 ? '恒等式，任意 x 均为解' : '无解';
      return `一次方程：x = ${fmt(-c / b)}`;
    }
    const disc = b * b - 4 * a * c;
    if (disc < 0) {
      const re = fmt(-b / (2 * a)), im = fmt(Math.sqrt(-disc) / Math.abs(2 * a));
      return `判别式 <span class="num">${fmt(disc)}</span> &lt; 0，两个共轭复根：\nx₁ = <span class="num">${re} + ${im}i</span>\nx₂ = <span class="num">${re} - ${im}i</span>`;
    }
    const sq = Math.sqrt(disc);
    const x1 = (-b + sq) / (2 * a), x2 = (-b - sq) / (2 * a);
    return `判别式 Δ = <span class="num">${fmt(disc)}</span>\nx₁ = <span class="num">${fmt(x1)}</span>\nx₂ = <span class="num">${fmt(x2)}</span>\n韦达定理：x₁+x₂ = <span class="num">${fmt(-b/a)}</span>，x₁·x₂ = <span class="num">${fmt(c/a)}</span>`;
  }
  function solveLinear2() {
    const a1 = +document.getElementById('eq_a1').value, b1 = +document.getElementById('eq_b1').value, c1 = +document.getElementById('eq_c1').value;
    const a2 = +document.getElementById('eq_a2').value, b2 = +document.getElementById('eq_b2').value, c2 = +document.getElementById('eq_c2').value;
    const det = a1 * b2 - a2 * b1;
    if (Math.abs(det) < 1e-12) return '系数行列式为 0，无解或有无穷多解';
    const x = (c1 * b2 - c2 * b1) / det, y = (a1 * c2 - a2 * c1) / det;
    return `D = <span class="num">${fmt(det)}</span>\nx = <span class="num">${fmt(x)}</span>\ny = <span class="num">${fmt(y)}</span>`;
  }
  function solveLinear3() {
    const M = [
      [+document.getElementById('l3_11').value, +document.getElementById('l3_12').value, +document.getElementById('l3_13').value, +document.getElementById('l3_14').value],

      [+document.getElementById('l3_31').value, +document.getElementById('l3_32').value, +document.getElementById('l3_33').value, +document.getElementById('l3_34').value]
    ];
    const det = M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1]) - M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0]) + M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);
    if (Math.abs(det) < 1e-12) return '系数行列式为 0，无解或有无穷多解';
    let out = `D = <span class="num">${fmt(det)}</span>\n`;
    ['x','y','z'].forEach((name, i) => {
      const C = [M[0].slice(), M[1].slice(), M[2].slice()];
      for (let r = 0; r < 3; r++) C[r][i] = M[r][3];
      const d = C[0][0]*(C[1][1]*C[2][2]-C[1][2]*C[2][1]) - C[0][1]*(C[1][0]*C[2][2]-C[1][2]*C[2][0]) + C[0][2]*(C[1][0]*C[2][1]-C[1][1]*C[2][0]);
      out += `${name} = <span class="num">${fmt(d / det)}</span>\n`;
    });
    return out;
  }
  function solveCubic(a, b, c, d) {
    if (a === 0) return solveQuad(b, c, d);
    const A = b / a, B = c / a, C = d / a;
    const p = B - A * A / 3, q = 2 * A * A * A / 27 - A * B / 3 + C;
    const disc = q * q / 4 + p * p * p / 27;
    const roots = [];
    if (Math.abs(p) < 1e-14 && Math.abs(q) < 1e-14) {
      roots.push(0, 0, 0);
    } else if (disc > 0) {
      const u = -q / 2 + Math.sqrt(disc), v = -q / 2 - Math.sqrt(disc);
      const cb = (t) => Math.sign(t) * Math.pow(Math.abs(t), 1/3);
      roots.push(cb(u) + cb(v));
    } else {
      const r = Math.sqrt(-p / 3), th = Math.acos(-q / (2 * Math.pow(-p/3, 1.5)));
      for (let k = 0; k < 3; k++) roots.push(2 * r * Math.cos((th + 2 * Math.PI * k) / 3));
    }
    const shift = -A / 3;
    const real = roots.map(r => r + shift);
    let out = `判别式 = <span class="num">${fmt(disc)}</span>\n`;
    real.forEach((r, i) => { out += `x${i+1} = <span class="num">${fmt(r)}</span>\n`; });
    return out;
  }
