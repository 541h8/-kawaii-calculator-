  // ===== 函数图像绘制模块 =====
  // 安全的表达式编译：把用户输入编译成可求值的函数
  // 支持 ^ 幂、隐式乘法、正负号简化、常用数学函数
  function compileExpr(src) {
    let s = String(src).trim();
    if (!s) throw new Error('表达式不能为空');

    // 1. 符号归一化
    s = s.replace(/[πΠ]/g, 'PI')
         .replace(/[×]/g, '*')
         .replace(/[÷]/g, '/')
         .replace(/--/g, '+').replace(/\+\+/g, '+');   // 化简连续符号

    // 2. 幂运算：把 x^2、2^x、sin(x)^2 转成 pow(...)（从右向左处理右结合）
    const powRe = /([a-zA-Z0-9_.()]+|\))\s*\^\s*([a-zA-Z0-9_.]+|\([^()]*\))/;
    let guard = 0;
    while (powRe.test(s) && guard++ < 50) {
      s = s.replace(powRe, (m, base, exp) => '\u0001(' + base + ',' + exp + ')');
    }

    // 3. 占位符 \u0001 替换为 pow，避免被后续正则误伤
    s = s.replace(/\u0001/g, 'pow');

    // 4. 补隐式乘法（必须在幂运算之后，用占位保护）
    s = s.replace(/(\d)\s*([(xa-zA-Z])/g, '$1\u0002$2')       // 2x → 2*x
         .replace(/\)\s*([(xa-zA-Z0-9_])/g, ')\u0002$1')       // )( → )*(  )x → )*x  )2 → )*2
         .replace(/([xa-zA-Z0-9_.])\s*\(/g, '$1\u0002(');      // x( → x*(  PI( → PI*(
    s = s.replace(/\u0002/g, '*');

    // 5. 安全保护：在危险字符前插入无害标记，再做白名单过滤
    //    允许字符：字母数字 _ . + - * / % ( ) , 空格 制表符
    if (/[^a-zA-Z0-9_+\-*/%(),. \t]/.test(s)) throw new Error('表达式含非法字符');

    // 6. 标识符白名单校验
    const allowed = ['PI','E','pow','sin','cos','tan','asin','acos','atan','sinh','cosh','tanh','sqrt','abs','log','ln','exp','floor','ceil','round','random','min','max'];
    const idRe = /[a-zA-Z_$][a-zA-Z0-9_$]*/g;
    let m;
    while ((m = idRe.exec(s)) !== null) {
      const name = m[0];
      if (!allowed.includes(name) && name !== 'x') {
        throw new Error('不支持的标识符或函数: ' + name);
      }
    }

    // 7. 在 Math 作用域内求值（sin/cos/pow/PI 等直接可用）
    const body = 'with(Math){ return (' + s + '); }';
    const fn = new Function('x', body);
    const t = fn(1.5);
    if (typeof t !== 'number' || !isFinite(t)) throw new Error('表达式在 x=1.5 处求值异常');
    return fn;
  }

  // 自动挑选"好看"的刻度步长
  function niceStep(raw) {
    const exp = Math.floor(Math.log10(raw));
    const f = raw / Math.pow(10, exp);
    let nf;
    if (f < 1.5) nf = 1;
    else if (f < 3) nf = 2;
    else if (f < 7.5) nf = 5;
    else nf = 10;
    return nf * Math.pow(10, exp);
  }

  const Graph = {
    cv: null, ctx: null, wrap: null,
    fn: null, exprText: '',
    // 视图状态：以数学单位计
    xMin: -10, xMax: 10, yMin: -6, yMax: 6,
    pxPerUnit: 40,                  // 由范围计算
    width: 600, height: 360,
    hasGrid: true,
    dpr: 1,
    colors: ['#e91e63','#7c4dff','#00bcd4','#ff9800','#4caf50','#f44336','#3f51b5','#009688'],

    init() {
      this.cv = document.getElementById('graphCanvas');
      this.ctx = this.cv.getContext('2d');
      this.wrap = document.getElementById('canvasWrap');
      this.dpr = window.devicePixelRatio || 1;
      this.resize();
      window.addEventListener('resize', () => this.resize());
      this.bindInteraction();
    },

    resize() {
      const rect = this.wrap.getBoundingClientRect();
      const w = Math.max(rect.width || 340, 280);
      this.width = w;
      this.height = Math.round(w * 0.6);
      this.cv.width = Math.round(this.width * this.dpr);
      this.cv.height = Math.round(this.height * this.dpr);
      this.cv.style.width = this.width + 'px';
      this.cv.style.height = this.height + 'px';
      this.recalcScale();
      if (this.fn) this.draw();
    },

    recalcScale() {
      this.pxPerUnit = this.width / (this.xMax - this.xMin);
      const target = this.pxPerUnit;
      // y 范围保持比例，使 1 单位 x ≈ 1 单位 y（各方向像素一致）
      const ySpan = this.height / target;
      const cx = (this.xMin + this.xMax) / 2;
      this.yMin = -ySpan / 2; // 暂存，随后用 cx 对齐
      // 让原点大致居中
      const cy = this.height / 2 / target;
      this.yMax = cy;
      this.yMin = -cy;
      // 重新用实际范围
      const ys = this.height / target;
      const mid = 0; // 原点在 y 方向也居中
      this.yMax = ys / 2;
      this.yMin = -ys / 2;
    },

    // 数学坐标 → 像素
    toPx(x, y) {
      return [
        (x - this.xMin) * this.pxPerUnit,
        this.height - (y - this.yMin) * this.pxPerUnit
      ];
    },

    draw() {
      const ctx = this.ctx;
      const W = this.cv.width, H = this.cv.height;
      const s = this.dpr;
      ctx.save();
      ctx.scale(s, s);
      ctx.clearRect(0, 0, this.width, this.height);

      // 背景
      ctx.fillStyle = document.body.classList.contains('theme-dark') ? '#0f0f1e' : '#fdfdff';
      ctx.fillRect(0, 0, this.width, this.height);

      // 网格 + 刻度
      this.drawGrid(ctx);

      // 坐标轴
      this.drawAxes(ctx);

      // 曲线
      this.drawCurve(ctx);

      ctx.restore();
    },

    drawGrid(ctx) {
      const step = niceStep((this.xMax - this.xMin) / 10);
      ctx.lineWidth = 1;
      ctx.font = '10px "WenQuanYi Micro Hei", sans-serif';
      const dark = document.body.classList.contains('theme-dark');
      const gridColor = dark ? 'rgba(255,255,255,.07)' : 'rgba(0,0,0,.06)';
      const tickColor = dark ? 'rgba(255,255,255,.5)' : 'rgba(0,0,0,.55)';

      const xStart = Math.ceil(this.xMin / step) * step;
      for (let x = xStart; x <= this.xMax + 1e-9; x += step) {
        const [px] = this.toPx(x, 0);
        if (Math.abs(x) < step / 2) continue;
        ctx.strokeStyle = gridColor;
        ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, this.height); ctx.stroke();
        if (this.hasGrid) {
          ctx.fillStyle = tickColor;
          const label = Math.abs(x) > 1e-9 ? this.fmtTick(x) : '';
          ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          if (label) ctx.fillText(label, px, this.height - this.toPx(0, 0)[1] + 3);
        }
      }

      const yStep = niceStep((this.yMax - this.yMin) / 10);
      const yStart = Math.ceil(this.yMin / yStep) * yStep;
      for (let y = yStart; y <= this.yMax + 1e-9; y += yStep) {
        const [, py] = this.toPx(0, y);
        if (Math.abs(y) < yStep / 2) continue;
        ctx.strokeStyle = gridColor;
        ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(this.width, py); ctx.stroke();
        if (this.hasGrid) {
          ctx.fillStyle = tickColor;
          ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
          ctx.fillText(this.fmtTick(y), this.toPx(0, 0)[0] - 4, py);
        }
      }
    },

    fmtTick(v) {
      if (Math.abs(v) < 1e-9) return '0';
      if (Math.abs(v) >= 1000 || (Math.abs(v) < 0.01 && v !== 0)) return v.toExponential(0).replace('e+', 'e');
      // 去掉浮点尾巴
      return String(parseFloat(v.toFixed(4)));
    },

    drawAxes(ctx) {
      const [ox, oy] = this.toPx(0, 0);
      const dark = document.body.classList.contains('theme-dark');
      const axisColor = dark ? '#8c7ae6' : '#7b4a7a';
      ctx.strokeStyle = axisColor;
      ctx.lineWidth = 1.6;
      // x 轴（若可见）
      if (oy >= 0 && oy <= this.height) {
        ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(this.width, oy); ctx.stroke();
      }
      // y 轴（若可见）
      if (ox >= 0 && ox <= this.width) {
        ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, this.height); ctx.stroke();
      }
      // 原点标记
      ctx.fillStyle = axisColor;
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      if (ox >= 0 && ox <= this.width && oy >= 0 && oy <= this.height) {
        ctx.fillText('O', ox - 3, oy + 2);
      }
    },

    drawCurve(ctx) {
      if (!this.fn) return;
      const n = Math.max(this.width * this.dpr, 400);
      const dark = document.body.classList.contains('theme-dark');
      ctx.lineWidth = 2.2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      let pen = false;
      let prevNan = true;
      let lastY = 0, lastPy = 0;

      ctx.beginPath();
      for (let i = 0; i <= n; i++) {
        const x = this.xMin + (i / n) * (this.xMax - this.xMin);
        let y, bad = false;
        try {
          y = this.fn(x);
          if (!isFinite(y)) bad = true;
          else if (Math.abs(y) > 1e12) bad = true;      // 超大量按间断处理，避免溢出 NaN
        } catch(e) { bad = true; }
        if (bad) {
          pen = false;
          prevNan = true;
          continue;
        }
        const px = this.toPx(x, y)[0], py = this.toPx(x, y)[1];
        // 纵向越界检测：像素坐标超出画布 ±50% 视为穿越极点/渐近线，断线
        if (py < -this.height * 0.5 || py > this.height * 1.5) {
          pen = false;
          prevNan = true;
          continue;
        }
        if (pen && !prevNan) {
          // 跨阶跃/渐近线的线段直接跳过（避免把 1/x 两侧连成斜线）
          const stepPx = (this.xMax - this.xMin) / n * this.pxPerUnit;
          const prev = this.toPx(x - (this.xMax - this.xMin) / n, lastY);
          const prevPy = this.toPx(x - (this.xMax - this.xMin) / n, lastY)[1];
          // 跳变检测：纵向变化超过画布 60% 或纵向速率异常大 → 视为渐近线/极点，断线
          if (stepPx > 1e-9 && (Math.abs(py - prevPy) > this.height * 0.6 || Math.abs((py - prevPy) / stepPx) > 25)) {
            ctx.moveTo(px, py);
          } else {
            ctx.lineTo(px, py);
          }
        } else {
          ctx.moveTo(px, py);
        }
        pen = true;
        prevNan = false;
        lastY = y; lastPy = py;
      }
      ctx.strokeStyle = this.colors[0];
      ctx.shadowColor = dark ? 'rgba(233,30,99,.5)' : 'rgba(233,30,99,.3)';
      ctx.shadowBlur = 4;
      ctx.stroke();
      ctx.shadowBlur = 0;
    },

    plot(expr, xmin, xmax) {
      const info = document.getElementById('graphInfo');
      try {
        this.fn = compileExpr(expr);
        this.exprText = expr;
        const a = Number(xmin), b = Number(xmax);
        if (!isFinite(a) || !isFinite(b)) throw new Error('x 范围需为有效数值');
        if (b <= a) throw new Error('x 最大值需大于最小值');
        this.xMin = a; this.xMax = b;
        this.recalcScale();
        this.draw();
        const zero = this.findZero();
        const ext = this.findExtremum();
        // 计算关键点
        const xs = (this.xMax - this.xMin) / 4;
        const samples = [-2, -1, 0, 1, 2].map(k => this.xMin + (this.xMax - this.xMin) * (k + 2) / 4);
        let points = [];
        samples.forEach(x => {
          try { const y = this.fn(x); if (isFinite(y)) points.push([x, y]); } catch(e) {}
        });
        const ys = points.map(p => p[1]);
        const maxY = ys.length ? Math.max(...ys) : 0;
        const minY = ys.length ? Math.min(...ys) : 0;
        const sum = ys.reduce((a, b) => a + b, 0);
        const mean = ys.length ? sum / ys.length : 0;
        let tbl = `<span class="lbl">y = </span><span class="num">${expr}</span>　<span class="lbl">定义域</span> x ∈ [${this.fmtTick(a)}, ${this.fmtTick(b)}]\n`;
        tbl += `<span class="lbl">采样关键点：</span>\n`;
        points.forEach(([x, y]) => {
          tbl += `  f(${this.fmtTick(x)}) = <span class="num">${this.fmtTick(y)}</span>\n`;
        });
        tbl += `<span class="lbl">采样极值：</span> 最小 <span class="num">${this.fmtTick(minY)}</span>，最大 <span class="num">${this.fmtTick(maxY)}</span>\n`;
        if (zero) tbl += `<span class="lbl">与 x 轴交点：</span> x = <span class="num">${this.fmtTick(zero)}</span>\n`;
        if (ext)  tbl += `<span class="lbl">极值点：</span> (${this.fmtTick(ext.x)}, <span class="num">${this.fmtTick(ext.y)}</span>)`;
        info.innerHTML = tbl;
        setMood('happy', 'sparkle');
        speak('ok');
        confetti();
      } catch(e) {
        speak('oops');
        info.textContent = '⚠️ ' + '\n💡 试试这些写法：2*x+1、x^2-4、sin(x)、sqrt(x)、log(x+5)';
        setMood('error', 'shake');
      }
    },

    zoom(factor, fx, fy) {
      // fx/fy 为画布像素坐标（聚焦中心）
      const cx = (fx !== undefined) ? this.xMin + fx / this.pxPerUnit : (this.xMin + this.xMax) / 2;
      const cy = (fy !== undefined) ? this.yMin + (this.height - fy) / this.pxPerUnit : (this.yMin + this.yMax) / 2;
      const nw = (this.xMax - this.xMin) * factor;
      const nh = (this.yMax - this.yMin) * factor;
      this.xMin = cx - nw / 2; this.xMax = cx + nw / 2;
      this.yMin = cy - nh / 2; this.yMax = cy + nh / 2;
      this.recalcScale();
      this.draw();
    },

    pan(dx, dy) {
      const ux = dx / this.pxPerUnit;
      const uy = dy / this.pxPerUnit;
      this.xMin -= ux; this.xMax -= ux;
      this.yMin += uy; this.yMax += uy;
      this.recalcScale();
      this.draw();
    },

    // 数值求解：二分法找零点 / 极值点
    findZero() {
      try {
        const f = this.fn, a = this.xMin, b = this.xMax;
        const fa = f(a), fb = f(b);
        if (!isFinite(fa) || !isFinite(fb)) return null;
        if (fa * fb > 0) return null;
        let lo = a, hi = b, m;
        for (let i = 0; i < 80; i++) {
          m = (lo + hi) / 2;
          const fm = f(m);
          if (!isFinite(fm)) return null;
          if (fa * fm <= 0) hi = m; else lo = m;
        }
        return (lo + hi) / 2;
      } catch(e) { return null; }
    },
    findExtremum() {
      try {
        const f = this.fn, a = this.xMin, b = this.xMax;
        const n = 300;
        let best = null, bx = a;
        for (let i = 0; i <= n; i++) {
          const x = a + (b - a) * i / n;
          const y = f(x);
          if (isFinite(y) && (best === null || y > best)) { best = y; bx = x; }
        }
        if (best === null) return null;
        // 黄金分割精修
        let lo = bx - (b - a) / n, hi = bx + (b - a) / n;
        lo = Math.max(a, lo); hi = Math.min(b, hi);
        const gr = 0.6180339887;
        let x1 = lo + (1 - gr) * (hi - lo), x2 = lo + gr * (hi - lo);
        let f1 = f(x1), f2 = f(x2);
        for (let i = 0; i < 60; i++) {
          if (!isFinite(f1) || !isFinite(f2)) break;
          if (f1 < f2) { lo = x1; x1 = x2; f1 = f2; x2 = lo + gr * (hi - lo); f2 = f(x2); }
          else { hi = x2; x2 = x1; f2 = f1; x1 = lo + (1 - gr) * (hi - lo); f1 = f(x1); }
        }
        const xm = (lo + hi) / 2, ym = f(xm);
        return isFinite(ym) ? { x: xm, y: ym } : null;
      } catch(e) { return null; }
    },

        bindInteraction() {
      let dragging = false, lastX, lastY;
      const cv = this.cv;

      const getPos = (e) => {
        const r = cv.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: t.clientX - r.left, y: t.clientY - r.top };
      };

      cv.addEventListener('mousedown', (e) => {
        dragging = true; lastX = e.clientX; lastY = e.clientY;
        cv.style.cursor = 'grabbing';
      });
      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        this.pan(e.clientX - lastX, e.clientY - lastY);
        lastX = e.clientX; lastY = e.clientY;
      });
      window.addEventListener('mouseup', () => { dragging = false; cv.style.cursor = 'crosshair'; });

      cv.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
        }
      }, { passive: true });
      cv.addEventListener('touchmove', (e) => {
        if (!dragging || e.touches.length !== 1) return;
        const t = e.touches[0];
        this.pan(t.clientX - lastX, t.clientY - lastY);
        lastX = t.clientX; lastY = t.clientY;
      }, { passive: true });
      cv.addEventListener('touchend', () => { dragging = false; });

      cv.addEventListener('wheel', (e) => {
        e.preventDefault();
        const p = getPos(e);
        const factor = e.deltaY < 0 ? 0.85 : 1.18;
        this.zoom(factor, p.x, p.y);
      }, { passive: false });

      // 双击复位
      cv.addEventListener('dblclick', () => {
        this.xMin = Number(document.getElementById('graphXmin').value) || -10;
        this.xMax = Number(document.getElementById('graphXmax').value) || 10;
        this.recalcScale();
        this.draw();
        showToast('视图已复位 ↺');
      });
    }
  };

  function bindGraphPanel() {
    Graph.init();

    // 预设快捷按钮
    document.querySelectorAll('[data-pre]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-pre]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('graphExpr').value = btn.dataset.pre;
        doPlot();
        playSound('pop');
      });
    });

    function doPlot() {
      const expr = document.getElementById('graphExpr').value.trim();
      const xmin = document.getElementById('graphXmin').value;
      const xmax = document.getElementById('graphXmax').value;
      Graph.hasGrid = document.getElementById('graphGrid').checked;
      if (!expr) { showToast('请输入表达式～'); return; }
      Graph.plot(expr, xmin, xmax);
    }

    document.getElementById('graphPlot').addEventListener('click', () => { doPlot(); });
    document.getElementById('graphExpr').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); doPlot(); }
    });
    document.getElementById('graphGrid').addEventListener('change', () => {
      Graph.hasGrid = document.getElementById('graphGrid').checked;
      Graph.draw();
    });
    ['graphXmin','graphXmax'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => doPlot());
    });
  }

  function openGraphPanel() {
    closeAllPanels();
    document.getElementById('calc').classList.add('show-graph');
    setTimeout(() => Graph.resize(), 50);
    setMood('think'); playSound('whoosh');
  }
  function closeGraphPanel() { document.getElementById('calc').classList.remove('show-graph'); setMood('idle'); }

  // ===== 初始化 =====
  bindDateCalc();
  bindProgPanel();
  bindStatsPanel();
  bindEqPanel();
  bindGeoPanel();
  bindFinPanel();
  bindGraphPanel();
  loadData();
</script>
